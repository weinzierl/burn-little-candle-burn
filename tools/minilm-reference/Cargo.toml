[package]
name = "minilm-precise"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Same crates and versions as candle-batteries (Cargo.lock copied from there).
[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1", features = ["blocking"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
