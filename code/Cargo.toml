[workspace]
resolver = "3"
members = ["candle-demo", "burn-demo", "tiny"]
exclude = ["firmware", "candle-nostd-check"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned on purpose: verified in the talk sandbox on 2026-10-31.
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
burn = { version = "=0.22.1", default-features = false }
safetensors = "=0.8.0"

[profile.release]
debug = false
