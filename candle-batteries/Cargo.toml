[workspace]
members = ["1-tensors", "2-classify", "3-similar", "4-ask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
# Same version and regex engine as candle-core's own tokenizers dependency,
# so only one copy is compiled.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
